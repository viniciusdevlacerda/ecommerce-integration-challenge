[project]
name = "ecommerce-integration"
version = "1.0.0"
description = "Pipeline de integracao em larga escala para e-commerce (desafio tecnico senior)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "TID"]
ignore = ["B008"]  # FastAPI Depends() no default e idiomatico

[tool.mypy]
python_version = "3.12"
packages = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exige a stack no ar (docker compose up)",
]
